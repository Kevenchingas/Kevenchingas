name: Generate Pac-Man contributions
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/pacman.yml'
permissions:
  contents: write
concurrency:
  group: pacman-output
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: Kevenchingas
          games: pacman
      - name: Publish generated SVGs to pacman-output
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: pacman-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
